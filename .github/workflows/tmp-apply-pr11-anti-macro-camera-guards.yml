name: Apply PR 11 anti-macro camera guards

on:
  push:
    branches:
      - feature/qol-startup-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qol-startup-controls
          fetch-depth: 0

      - name: Apply exact camera guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('webclient/src/client/Client.ts')
          source = path.read_text()
          replacements = [
              (
                  'const orbitX: number = this.localPlayer.x + this.macroCameraX;',
                  'const orbitX: number = this.localPlayer.x + (ANTI_MACRO_ROTATION_ENABLED ? this.macroCameraX : 0);',
              ),
              (
                  'const orbitZ: number = this.localPlayer.z + this.macroCameraZ;',
                  'const orbitZ: number = this.localPlayer.z + (ANTI_MACRO_ROTATION_ENABLED ? this.macroCameraZ : 0);',
              ),
              (
                  'const yaw: number = (this.orbitCameraYaw + this.macroCameraAngle) & 0x7ff;',
                  'const yaw: number = (this.orbitCameraYaw + (ANTI_MACRO_ROTATION_ENABLED ? this.macroCameraAngle : 0)) & 0x7ff;',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- webclient/src/client/Client.ts
          git rm .github/workflows/tmp-apply-pr11-anti-macro-camera-guards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webclient/src/client/Client.ts
          git commit -m "QOL: fully gate anti-macro camera offsets"
          git push origin HEAD:feature/qol-startup-controls
